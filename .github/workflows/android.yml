name: Android APK
on:
  push:
    branches: [main, feature/automatic-sleep-sync]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK (pull requests only)
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ROGBID_KEYSTORE_BASE64 }}
          ROGBID_KEYSTORE_PASSWORD: ${{ secrets.ROGBID_KEYSTORE_PASSWORD }}
          ROGBID_KEY_ALIAS: ${{ secrets.ROGBID_KEY_ALIAS }}
          ROGBID_KEY_PASSWORD: ${{ secrets.ROGBID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$ROGBID_KEYSTORE_PASSWORD" || -z "$ROGBID_KEY_ALIAS" || -z "$ROGBID_KEY_PASSWORD" ]]; then
            echo "::error::Configure all four ROGBID signing secrets before building release APK."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rogbid-release.jks"
          echo "ROGBID_KEYSTORE_PATH=$RUNNER_TEMP/rogbid-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ROGBID_KEYSTORE_PASSWORD: ${{ secrets.ROGBID_KEYSTORE_PASSWORD }}
          ROGBID_KEY_ALIAS: ${{ secrets.ROGBID_KEY_ALIAS }}
          ROGBID_KEY_PASSWORD: ${{ secrets.ROGBID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/rogbid-release.jks"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && success()
        with:
          name: rogbid-bridge-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && success()
        with:
          name: rogbid-bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
