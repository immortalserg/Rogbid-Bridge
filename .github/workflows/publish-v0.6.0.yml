name: Publish v0.6.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.6.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ROGBID_KEYSTORE_BASE64 }}
          ROGBID_KEYSTORE_PASSWORD: ${{ secrets.ROGBID_KEYSTORE_PASSWORD }}
          ROGBID_KEY_ALIAS: ${{ secrets.ROGBID_KEY_ALIAS }}
          ROGBID_KEY_PASSWORD: ${{ secrets.ROGBID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$ROGBID_KEYSTORE_PASSWORD" || -z "$ROGBID_KEY_ALIAS" || -z "$ROGBID_KEY_PASSWORD" ]]; then
            echo "::error::Missing signing secrets"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rogbid-release.jks"
          echo "ROGBID_KEYSTORE_PATH=$RUNNER_TEMP/rogbid-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ROGBID_KEYSTORE_PASSWORD: ${{ secrets.ROGBID_KEYSTORE_PASSWORD }}
          ROGBID_KEY_ALIAS: ${{ secrets.ROGBID_KEY_ALIAS }}
          ROGBID_KEY_PASSWORD: ${{ secrets.ROGBID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/rogbid-release.jks"
      - name: Verify APK and version
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          grep -q 'versionName = "0.6.0"' app/build.gradle.kts
          grep -q 'versionCode = 9' app/build.gradle.kts
          cp app/build/outputs/apk/release/app-release.apk Rogbid-Bridge-v0.6.0.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Rogbid Bridge v0.6.0

          First public release for Rogbid Z10 (Android 9).

          ### Features
          - Heart rate and SpO₂ measurements with local history
          - Daily steps, rounded kilocalories and distance in kilometres
          - Sleep history, stage visualization and diagnostic tools
          - Automatic and manual MQTT synchronization with Home Assistant MQTT Discovery
          - Nine color themes
          - Eight interface languages with automatic or manual selection
          - Background synchronization

          ### Screenshots
          <img src="https://raw.githubusercontent.com/immortalserg/Rogbid-Bridge/main/img/screenshot.png" width="220" alt="Screenshot 1"> <img src="https://raw.githubusercontent.com/immortalserg/Rogbid-Bridge/main/img/screenshot2.png" width="220" alt="Screenshot 2"> <img src="https://raw.githubusercontent.com/immortalserg/Rogbid-Bridge/main/img/screenshot3.png" width="220" alt="Screenshot 3"> <img src="https://raw.githubusercontent.com/immortalserg/Rogbid-Bridge/main/img/screenshot4.png" width="220" alt="Screenshot 4">

          ### Installation
          Download `Rogbid-Bridge-v0.6.0.apk` below and install on Rogbid Z10. Updates require the same signing key.
          NOTES
          if gh release view v0.6.0 >/dev/null 2>&1; then
            echo "Release v0.6.0 already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create v0.6.0 Rogbid-Bridge-v0.6.0.apk --target "$GITHUB_SHA" --title "Rogbid Bridge v0.6.0" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
