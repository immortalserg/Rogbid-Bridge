name: Wear OS APK
on:
  push:
    branches: [main]
    paths:
      - 'wearos/**'
      - 'shared/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/wearos.yml'
  pull_request:
    paths:
      - 'wearos/**'
      - 'shared/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/wearos.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Wear OS debug APK
        run: gradle :wearos:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: watch-bridge-wearos-debug
          path: wearos/build/outputs/apk/debug/wearos-debug.apk
          if-no-files-found: error
